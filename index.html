<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’aventure en droit à Aix</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f1eefb;--card:rgba(22,26,46,.8);--ocre:#e9b44c;--rose:#f4c7d0;--vert:#cfe3b8;--azur:#6c9cf0;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--card:rgba(14,17,32,.84)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#161a2e;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
#bg{position:fixed;inset:0;z-index:-1;background:#2b3270;transition:background .4s}
main{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.card{background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:16px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pg{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.pg i{display:block;height:100%;background:var(--ocre)}
.kick{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--ocre);font-weight:700}
h2{margin:.1em 0 .3em;font-size:1.5rem;font-weight:800;line-height:1.1}
h2.big{font-size:2.3rem}
p{margin:.4em 0}
.ph{width:64px;height:64px;border-radius:50%;border:2px solid var(--ocre);display:grid;place-items:center;font-size:2rem;overflow:hidden;background:var(--rose);float:right;margin:0 0 6px 10px;cursor:pointer;transition:width .25s,height .25s}
.ph.big{width:150px;height:150px}
.ph img{width:100%;height:100%;object-fit:cover}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;clear:both}
.tag{font-size:.85rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px}
.q{font-style:italic;color:var(--ocre);margin:.5em 0 0}
button{font:inherit;cursor:pointer;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08);color:var(--ink);border-radius:12px;padding:11px 14px;text-align:center}
button:hover{background:var(--ocre);color:#1e2540}
button:focus-visible{outline:3px solid var(--azur);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.go{width:100%;margin-top:12px;background:var(--ocre);color:#1e2540;font-weight:800;border-color:var(--ocre)}
.ch{display:grid;gap:8px;margin-top:8px}
.ok{background:var(--vert)!important;color:#1e2540!important}
.ko{background:var(--rose)!important;color:#1e2540!important}
.hud{display:flex;justify-content:space-between;font-weight:700;margin:8px 0}
#field{position:relative;height:210px;background:rgba(207,227,184,.25);border:2px solid rgba(255,255,255,.5);border-radius:14px;overflow:hidden}
#ball{position:absolute;font-size:2.4rem;border:0;background:none;padding:0;line-height:1;transition:left .15s,top .15s}
#ball:hover{background:none}
.holes,.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.mem{grid-template-columns:repeat(4,1fr);max-width:340px}
.hole,.mem button{aspect-ratio:1;font-size:2rem;padding:0}
.mem button.up{background:var(--ocre);color:#1e2540}
.msg{margin-top:10px;font-weight:700;color:var(--ocre)}
input.nom{font:inherit;width:100%;padding:11px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);color:var(--ink);margin-top:10px}
input.nom::placeholder{color:rgba(241,238,251,.6)}
/* photos : snap */
.sp{position:relative;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.1);margin-top:8px}
.sp .un{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem}
.sp .ov{position:absolute;inset:0}
.react{display:flex;gap:8px;margin-top:8px}
.react button{flex:1;font-size:1.6rem;padding:8px}
/* photos : puzzle */
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:300px;margin:8px auto}
.puz button,.puz button:hover{padding:0;border:0;background:none;border-radius:6px;overflow:hidden;aspect-ratio:1}
.puz button.sel{outline:3px solid var(--ocre);outline-offset:-3px}
.tl{position:relative;width:100%;height:100%}
.tl span{position:absolute;top:3px;left:5px;font-size:.75rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
/* photos : mur de polaroids */
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.pol,.pol:hover{padding:0;border:0;background:none;aspect-ratio:3/4;perspective:700px}
.pol .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;transform:rotate(var(--r))}
.pol.f .in{transform:rotate(var(--r)) rotateY(180deg)}
.pol .fa,.pol .ba{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;background:#f6f1e7;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pol .fa{display:flex;padding:8px 8px 30px}
.pol .im{flex:1;border-radius:2px}
.pol .ba{transform:rotateY(180deg);color:#1e2540;display:grid;place-items:center;text-align:center;font-weight:700;padding:10px;font-size:.95rem}
</style>
</head>

<main id="app"></main>

{bg:3,c:"luna",k:"Personnages 2 à 5",t:"Luna, Liv, Carla et Inès",x:"Les filles de Marseille : des petites bobos de la Plaine, toutes les quatre. Elles arrivent ensemble, repartent ensemble, et te rappellent d’où elles viennent avant même de dire bonjour.",tags:["🌊 Marseillaises","🏠 La Plaine, évidemment","👯 Toujours en groupe"],q:"« Nous, on est de la Plaine. »"},
{bg:4,c:"carla",k:"Personnage 3",t:"Carla",x:"Carla, c’est la cible officielle des photos bizarres du groupe. Chaque semaine, une nouvelle arrive sur le Snap du brunch des {A}. Elle proteste toujours, et elle rit toujours la première.",tags:["🌴 Cible officielle","📸 Une photo par semaine","😂 Très bonne joueuse"],q:"« Supprimez cette photo. Tout de suite. »"},
{bg:5,c:"paolo",k:"Personnage 6",t:"Paolo",x:"Le gauchiste de la bande, la mâchoire toujours serrée. Il est prêt à débattre de tout, même de la carte du brunch. Le pire, c’est qu’il finit souvent par avoir raison.",tags:["✊ Gauchiste","😤 Mâchoire serrée","🗣️ Débat sur tout"],q:"« Non mais attends, c’est politique. »"},
{bg:6,c:"simon",k:"Personnage 7",t:"Simon",x:"Le nouveau du groupe. Comme toi, il découvre encore les codes : où s’asseoir, qui chambrer, et comment survivre au Snap. Il apprend vite, et il a déjà son surnom.",tags:["😎 Le nouveau","🧭 Cherche les codes","🤝 Déjà adopté"],q:"« Je comprends tout. Enfin, presque. »"},
{bg:7,c:"nils",k:"Personnage 8",t:"Nils",x:"Il fait énormément de sport. Et oui, il est beau gosse : un petit détail que tout le monde remarque, lui le premier. Il peut te faire des tractions entre deux phrases.",tags:["🏃 Sport tous les jours","💪 Tractions partout","✨ Beau gosse, il le sait"],q:"« Je fais juste une petite séance. »"},
{bg:8,c:"noa",k:"Personnage 9",t:"Noa",x:"Il joue au foot, tout le temps, partout. Un ballon dans la cour, et le cours est oublié. S’il te voit avec les mains libres, tu es dans l’équipe.",tags:["⚽ Un ballon, toujours","🏟️ La cour est son stade","📉 Cours oubliés"],q:"« Allez, une dernière passe ! »"},
{bg:9,c:"errikos",k:"Personnage 10",t:"Errikos",x:"Il bosse énormément. Trois pages de notes d’avance, des fiches avant les fiches. Au brunch, il commente même les révisions des autres, en mangeant son croissant.",tags:["📚 Bosse énormément","🗂️ Fiches avant les fiches","🧐 Relit vos révisions"],q:"« Vous avez relu le chapitre 3 ? »"},
{bg:10,k:"Contrôle",t:"Test express : connais-tu la bande ?",x:"La bande t’a présenté tout le monde. Reste à voir si tu as suivi.",g:"qui"},
{bg:11,k:"Midi",t:"Le Crous à 1 €",x:"Tout le monde mange au Crous, à 1 € le repas, comme tous les midis. Et les sauces ? Le brunch des {A} compte sur toi pour en ramener un maximum dans ton sac. Attention au surveillant.",g:"sauce"},
{bg:12,c:"noa",k:"Après-midi",t:"Le match",x:"Noa te lance un ballon sur le parvis. Nils, lui, enchaîne déjà ses tractions à côté. Tu ne peux pas refuser le défi.",g:"foot"},
{bg:"bu",k:"BU Schuman",t:"Le silence de la BU",x:"Fin d’après-midi, direction la BU Schuman. Hauts plafonds, longues tables, lampes vertes, et ce silence presque sacré que seul un téléphone peut briser. Errikos t’a gardé une place, évidemment, avec trois surligneurs alignés.",g:"chut"},
{bg:"bu",c:"errikos",k:"BU Schuman",t:"Les fiches d’Errikos",x:"Errikos te tend une fiche, très sérieux : quatre questions, et pas de brunch pour ceux qui ratent. Autour de vous, un étudiant soupire, un autre tourne une page : la BU respire.",g:"droit"},
{bg:13,k:"Pause",t:"Le Snap de la pause",x:"Dehors, le soleil tombe sur la cour. Le groupe balance des photos des anciens brunchs, et chaque Snap attend ta réaction. Réagis comme un vrai Amouptchou.",g:"snap"},
{bg:14,c:"simon",k:"Pause",t:"Le puzzle de Simon",x:"Simon sort son téléphone : « Les gars, on remet la photo du dernier brunch dans l’ordre ? » Touche deux cases pour les échanger, jusqu’à reformer l’image.",g:"puzzle"},
{bg:15,c:"lucas",k:"Le soir",t:"Au bar",x:"Lucas est déjà là, évidemment. « Demain, je vais en cours », dit-il pour la dixième fois. Personne ne le croit. Le Snap explose : le brunch de dimanche est lancé, et on te demande de retrouver les paires du menu.",g:"memo"},
{bg:16,k:"Souvenirs",t:"Le mur des photos",x:"Avant de rentrer, la bande accroche ses photos préférées sur le mur du groupe. Touche chaque polaroïd pour le retourner et lire la légende.",g:"mur"},
{bg:"bat",k:"Fin du premier jour",t:"À dimanche !",x:"La nuit tombe sur Aix, les arcades du bâtiment Pouillon s’éclairent, ton téléphone vibre encore. Tu es désormais officiellement un {A}, {nom}. Le prochain brunch t’attend, avec les croissants, les sauces du Crous et toute la bande."}
];

var i=0,TM=[];
var app=document.getElementById("app"),bg=document.getElementById("bg");
function T(s){return s.replace(/\{A\}/g,A).replace(/\{nom\}/g,PRENOM)}
function clr(){TM.forEach(clearInterval);TM=[]}
function tick(f,ms){var x=setInterval(f,ms);TM.push(x);return x}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function U(u){return "url("+u+") center/cover no-repeat"}
function BG(b,intro){
var g=intro?"linear-gradient(rgba(20,24,46,.05),rgba(20,24,46,.9))":"linear-gradient(rgba(20,24,46,.35),rgba(20,24,46,.82))",L;
L=[U(BAT)];
return g+","+L.join(",")+",#2b3270"}
function av(id){return '<div class="ph" title="Touche pour agrandir"><img src="photos/'+id+'.jpg" alt="'+id+'" onerror="this.parentNode.textContent=\''+E[id]+'\'"></div>'}
function pic(n,h){return '<div class="sp" style="height:'+h+'px"><div class="un">📸</div><div class="ov" style="background:url(photos/IMG_'+IM[n]+'.jpeg) center/cover no-repeat"></div></div>'}

function show(){
clr();var s=S[i],last=i===S.length-1,intro=i===0;
bg.style.background=BG(s.bg,intro);
var tags=s.tags?'<div class="tags">'+s.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div>':'';
app.innerHTML='<div class="card">'+(intro?'':'<div class="pg"><i style="width:'+(i/(S.length-1)*100)+'%"></i></div>')+(s.c?av(s.c):'')+(s.k?'<div class="kick">'+s.k+'</div>':'')+'<h2'+(intro?' class="big"':'')+'>'+T(s.t)+'</h2><p>'+T(s.x)+'</p>'+tags+(s.q?'<p class="q">'+s.q+'</p>':'')+'<div id="gm"></div><button class="go" id="nx"'+(s.g?' hidden':'')+'>'+(last?'Rejouer l’aventure':'Continuer →')+'</button></div>';
window.scrollTo(0,0);
var p=app.querySelector(".ph");if(p)p.onclick=function(){p.classList.toggle("big")};
var nx=document.getElementById("nx");
nx.onclick=function(){i=last?0:i+1;show()};
if(s.g)G[s.g](document.getElementById("gm"),function(m){document.getElementById("gm").insertAdjacentHTML("beforeend",'<p class="msg">'+m+'</p>');nx.hidden=false})}

/* ---------- Jeux ---------- */
function quiz(b,Q,msg,end){var k=0,s=0;
function q1(){var q=Q[k];b.innerHTML='<p><b>'+q.q+'</b></p><div class="ch">'+q.o.map(function(o,j){return '<button data-j="'+j+'">'+o+'</button>'}).join('')+'</div>';
b.querySelectorAll("button").forEach(function(x){x.onclick=function(){var j=+x.dataset.j;
b.querySelectorAll("button").forEach(function(y){y.disabled=true;if(+y.dataset.j===q.a)y.classList.add("ok")});
if(j===q.a)s++;else x.classList.add("ko");
setTimeout(function(){k++;if(k<Q.length)q1();else{b.innerHTML="";end(s+" / "+Q.length+" : "+msg(s,Q.length))}},900)}})}
q1()}
function hud(l,t){return '<div class="hud"><span>'+l+' <span id="sc">0</span></span><span>⏱ <span id="tm">'+t+'</span> s</span></div>'}
function clock(t,f){tick(function(){t--;document.getElementById("tm").textContent=t;if(t<=0){clr();f()}},1000)}
var G={
nom:function(b,end){
b.innerHTML='<input class="nom" id="nm" placeholder="Ton prénom" maxlength="20" autocomplete="off"><button class="go" id="ok">Entrer sur le campus</button>';
var nm=document.getElementById("nm");
function go(){var v=nm.value.trim().replace(/[<>&"]/g,"");if(v)PRENOM=v;b.innerHTML="";end("Enchanté, "+PRENOM+" ! La bande t’attend.")}
document.getElementById("ok").onclick=go;
nm.onkeydown=function(e){if(e.key==="Enter")go()}},
aix:function(b,end){quiz(b,[
{q:"Quelle montagne, peinte par Cézanne, domine Aix ?",o:["Le Mont Ventoux","La Sainte-Victoire","Le Luberon"],a:1},
{q:"Quelle spécialité sucrée est le symbole d’Aix ?",o:["Le calisson","La tarte tropézienne","Le nougat de Montélimar"],a:0},
{q:"Comment s’appelle la grande avenue bordée de platanes et de fontaines ?",o:["La Canebière","Le Cours Mirabeau","La Promenade des Anglais"],a:1}
],function(s,n){return s===n?"Déjà un vrai Aixois !":"Tu apprendras vite, les platanes t’aideront."},end)},
qui:function(b,end){quiz(b,[
{q:"Toujours au bar ou au BJS, jamais en cours.",o:["Lucas","Errikos","Paolo","Noa"],a:0},
{q:"Le gauchiste à la mâchoire serrée.",o:["Nils","Paolo","Simon","Lucas"],a:1},
{q:"Il fait beaucoup de sport, et il est beau gosse.",o:["Noa","Errikos","Nils","Simon"],a:2},
{q:"Le nouveau du groupe.",o:["Simon","Lucas","Paolo","Noa"],a:0},
{q:"Il bosse énormément.",o:["Lucas","Errikos","Noa","Nils"],a:1},
{q:"Un ballon dans la cour, et le cours est oublié.",o:["Nils","Simon","Noa","Paolo"],a:2}
],function(s,n){return s===n?"Tu as tout retenu, bienvenue dans la bande !":"Pas grave, la bande te pardonnera (peut-être)."},end)},
sauce:function(b,end){var s=0,cur=-1,H;
b.innerHTML=hud("Sauces :",12)+'<div class="holes">'+"012345678".split("").map(function(){return '<button class="hole"></button>'}).join("")+'</div><p>Tape les 🥫 pour les mettre dans ton sac. Le 🧑‍🍳 te coûte 2 sauces.</p>';
H=b.querySelectorAll(".hole");
function pop(){if(cur>=0)H[cur].textContent="";cur=Math.floor(Math.random()*9);H[cur].textContent=rnd(["🥫","🥫","🥫","🧑‍🍳"])}
H.forEach(function(x){x.onclick=function(){if(!x.textContent)return;s=Math.max(0,s+(x.textContent==="🥫"?1:-2));document.getElementById("sc").textContent=s;x.textContent=""}});
pop();tick(pop,700);
clock(12,function(){b.innerHTML="";end(s+" sauces dans le sac. "+(s>=8?"Le brunch est sauvé !":"Il va falloir retourner au Crous."))})},
foot:function(b,end){var s=0,f,ba;
b.innerHTML=hud("⚽",12)+'<div id="field"><button id="ball" aria-label="Ballon">⚽</button></div>';
f=document.getElementById("field");ba=document.getElementById("ball");
function mv(){ba.style.left=Math.random()*(f.clientWidth-46)+"px";ba.style.top=Math.random()*(f.clientHeight-46)+"px"}
mv();ba.onclick=function(){s++;document.getElementById("sc").textContent=s;mv()};
tick(mv,800);
clock(12,function(){b.innerHTML="";end(s+" arrêts. "+(s>=10?"Noa et Nils te veulent dans l’équipe !":"Pas mal, mais tu seras sur le banc."))})},
chut:function(b,end){var s=0,m=0,cur=-1,H;
b.innerHTML=hud("Téléphones coupés :",15)+'<div class="holes">'+"012345678".split("").map(function(){return '<button class="hole" aria-label="Case"></button>'}).join("")+'</div><p>Coupe les 📱 avant qu’ils sonnent. Cinq sonneries et c’est la porte. <b>Ratés : <span id="ms">0</span> / 5</b></p>';
H=b.querySelectorAll(".hole");
function fin(){clr();b.innerHTML="";end(m>=5?"Dehors ! La bibliothécaire t’a repéré. Errikos fait semblant de ne pas te connaître.":(s>=8?s+" téléphones coupés : silence parfait, même la bibliothécaire sourit.":s+" téléphones coupés : quelques sonneries, mais tu restes admis."))}
function pop(){
if(cur>=0&&H[cur].textContent==="📱"){m++;document.getElementById("ms").textContent=m;H[cur].textContent="";if(m>=5){fin();return}}
cur=Math.floor(Math.random()*9);H[cur].textContent="📱"}
H.forEach(function(x){x.onclick=function(){if(x.textContent!=="📱")return;s++;document.getElementById("sc").textContent=s;x.textContent=""}});
pop();tick(pop,800);
clock(15,fin)},
droit:function(b,end){quiz(b,[
{q:"À quel âge devient-on majeur en France ?",o:["16 ans","18 ans","21 ans"],a:1},
{q:"Qui promulgue la loi ?",o:["Le président de la République","Le président de l’Assemblée","Le Conseil d’État"],a:0},
{q:"« Pacta sunt servanda » signifie :",o:["Nul n’est censé ignorer la loi","Les conventions doivent être respectées","La loi est dure mais c’est la loi"],a:1},
{q:"Quel texte de 1804 est la base du droit civil français ?",o:["Le Code civil","Le Code pénal","La Déclaration de 1789"],a:0}
],function(s,n){return s>=3?"Errikos hoche la tête : tu mérites ton brunch.":"Errikos soupire et te prête ses fiches."},end)},
snap:function(b,end){
var ph=shuf(ALL).slice(0,3),k=0,R=["Carla : « Supprimez cette photo. »","Lucas : « Je ne me souviens de rien. »","Paolo : « Cette photo est un acte politique. »"];
function one(){
b.innerHTML=pic(ph[k],230)+'<p class="msg" id="rp">Snap '+(k+1)+' / 3 : ta réaction ?</p><div class="react">'+["😂","🔥","💀"].map(function(e){return '<button>'+e+'</button>'}).join("")+'</div>';
b.querySelectorAll(".react button").forEach(function(x){x.onclick=function(){
b.querySelectorAll(".react button").forEach(function(y){y.disabled=true});
x.classList.add("ok");document.getElementById("rp").textContent=R[k];
setTimeout(function(){k++;if(k<3)one();else{b.innerHTML="";end("Le Snap est en feu : 3 réactions, 0 photo supprimée.")}},1400)}})}
one()},
puzzle:function(b,end){
var n=Math.floor(Math.random()*IM.length),P=[0,1,2,3,4,5,6,7,8],sel=-1,m=0,done=0;
function ok(){return P.every(function(v,k){return v===k})}
do{P=shuf(P)}while(ok());
function R(){
b.innerHTML='<div class="hud"><span>Puzzle</span><span>Échanges : '+m+'</span></div><div class="puz">'+P.map(function(v,k){
var x=(v%3)*50,y=Math.floor(v/3)*50;
return '<button data-k="'+k+'"'+(k===sel?' class="sel"':'')+' aria-label="Case"><div class="tl" style="background:url(photos/IMG_'+IM[n]+'.jpeg) '+x+'% '+y+'%/300% 300% no-repeat,hsl('+(v*40)+',45%,40%)"><span>'+(v+1)+'</span></div></button>'}).join("")+'</div>';
b.querySelectorAll(".puz button").forEach(function(x){x.onclick=function(){
if(done)return;var k=+x.dataset.k;
if(sel<0)sel=k;else{if(sel!==k){var t=P[sel];P[sel]=P[k];P[k]=t;m++}sel=-1}
R();
if(ok()){done=1;setTimeout(function(){b.innerHTML="";end("Image reconstituée en "+m+" échanges. "+(m<=12?"Simon est bluffé !":"Simon te félicite quand même."))},800)}}})}
R()},
memo:function(b,end){
var X=["🥐","🥞","🍓","☕","🧇","🍊","🥑","🍳"],C=shuf(X.concat(X)),o=[],m=0,f=0,lock=0;
b.innerHTML='<div class="hud"><span>Mémoire du brunch</span><span>Coups : <span id="mv">0</span></span></div><div class="mem">'+C.map(function(){return '<button aria-label="Carte">?</button>'}).join('')+'</div>';
b.querySelectorAll(".mem button").forEach(function(x,n){x.onclick=function(){
if(lock||x.classList.contains("up"))return;
x.classList.add("up");x.textContent=C[n];o.push(x);
if(o.length<2)return;
m++;document.getElementById("mv").textContent=m;
if(o[0].textContent===o[1].textContent){o[0].classList.add("ok");o[1].classList.add("ok");o=[];f++;
if(f===8)setTimeout(function(){b.innerHTML="";end(m+" coups. "+(m<=14?"Mémoire d’Amouptchou !":"Le brunch est servi, bravo."))},700)}
else{lock=1;setTimeout(function(){o.forEach(function(y){y.classList.remove("up");y.textContent="?"});o=[];lock=0},800)}}})},
mur:function(b,end){
var ph=shuf(ALL).slice(0,6),f=0,C=["Preuve que tout le monde était là","Le brunch avant le brunch","Personne ne regarde l’objectif","Dernier croissant : très disputé","La bande au complet (presque)","Souvenir à ne jamais supprimer"];
b.innerHTML='<div class="hud"><span>Photos retournées</span><span><span id="sc">0</span> / 6</span></div><div class="wall">'+ph.map(function(n,k){
return '<button class="pol" style="--r:'+(((k%3)-1)*3)+'deg" aria-label="Polaroïd"><div class="in"><div class="fa"><div class="im" style="background:url(photos/IMG_'+IM[n]+'.jpeg) center/cover no-repeat,#b9b2cf"></div></div><div class="ba">'+C[k]+'</div></div></button>'}).join("")+'</div>';
b.querySelectorAll(".pol").forEach(function(x){x.onclick=function(){
if(x.classList.contains("f"))return;
x.classList.add("f");f++;document.getElementById("sc").textContent=f;
if(f===6)setTimeout(function(){b.innerHTML="";end("Le mur est complet. Chaque photo a sa légende, chaque légende a sa histoire.")},1000)}})}
};
show();
</script>
